name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: anthropics/claude-code-action@v1
        with:
          # Requires one of these as a repo secret (Settings > Secrets and
          # variables > Actions):
          #   ANTHROPIC_API_KEY       -- pay-per-use, from platform.claude.com
          #   CLAUDE_CODE_OAUTH_TOKEN -- uses a Pro/Max/Team subscription
          #                              instead; get it via `claude setup-token`
          # Swap the line below to claude_code_oauth_token if using that.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
