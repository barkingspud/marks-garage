name: Crate Companion Android

# Builds the Android app. Every run produces a debug APK you can install by hand
# (download it from the run's "Artifacts"). When the signing secrets are set, it also
# produces a signed release APK and an AAB for the Play Store.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   DISCOGS_CONSUMER_KEY, DISCOGS_CONSUMER_SECRET  "Connect with Discogs" (optional; without them
#                                                  the app offers personal-token sign-in only)
# Repository variable (same page, Variables tab):
#   AI_SERVER_URL  the AI server's address, for AI without a key (optional; see
#                  crate-companion-ai-server.yml)
#   ANDROID_KEYSTORE_BASE64                        the release keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    branches: [main]
    paths: ['crate-companion/**', '.github/workflows/crate-companion-android.yml']
  pull_request:
    paths: ['crate-companion/**', '.github/workflows/crate-companion-android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crate-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crate-companion
    env:
      VITE_DISCOGS_CONSUMER_KEY: ${{ secrets.DISCOGS_CONSUMER_KEY }}
      VITE_DISCOGS_CONSUMER_SECRET: ${{ secrets.DISCOGS_CONSUMER_SECRET }}
      VITE_AI_SERVER_URL: ${{ vars.AI_SERVER_URL }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crate-companion/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the web app and copy it into the Android project
        run: |
          npm run build
          npx cap sync android
          echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: crate-companion/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build signed release (APK + AAB for the Play Store)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: crate-companion/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease bundleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crate-companion-debug-${{ env.VERSION_NAME }}-${{ github.run_number }}
          path: crate-companion/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release builds
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crate-companion-release-${{ env.VERSION_NAME }}-${{ github.run_number }}
          path: |
            crate-companion/android/app/build/outputs/apk/release/*.apk
            crate-companion/android/app/build/outputs/bundle/release/*.aab
          retention-days: 90
